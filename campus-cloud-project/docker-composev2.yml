services:
  #============================================#
  #Base de Datos postgres
  #============================================#
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      -  campuscloud_postgres_data:/var/lib/postgresql/data
    
    networks:
      - campus-network


#============================================#
  #PGADMIN
#============================================#  
  pgadmin:
    image: dpage/pgadmin4:6.17
    container_name: campuscloud-pgadmin
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"

    volumes:
      - campuscloud_pgadmin_data:/var/lib/pgadmin

    networks:
      - campus-network

#============================================#
  #SQL-SERVER
#============================================#  
  sql-server-cloud:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: campuscloud-sqlserver
    restart: always

    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"

    volumes:
      - campuscloud_sql_data:/var/opt/mssql

    networks:
      - campus-network

#============================================#
  #Volumenes
#============================================#  
volumes:
  campuscloud_postgres_data:
   external: true

  campuscloud_pgadmin_data:
   external: true

  campuscloud_sql_data:
   external: true

#============================================#
  #Redes
#============================================#
networks:
  campus-network:
    external: true
