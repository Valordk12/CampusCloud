services:
  #============================================#
  # POSTGRES
  #============================================#
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      -  postgres_data:/var/lib/postgresql/data
    
    networks:
      - campuscloud_net
    
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

#============================================#
# PGADMIN
#============================================#  
  pgadmin:
    image: dpage/pgadmin4:6.17
    container_name: campuscloud-pgadmin

    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"

    depends_on:
      postgres-cloud:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - campuscloud_net

    healthcheck:
      test: 
        [
        "CMD", "wget", "--spider", "-q", "http://localhost/login"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

#============================================#
# SQL-SERVER
#============================================#  
  sql-server-cloud:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: campuscloud-sqlserver

    restart: always

    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"

    volumes:
      - sql_data:/var/opt/mssql

    networks:
      - campuscloud_net
    
    healthcheck:
      test: 
        [
          "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -Q 'SELECT 1' -C || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

#============================================#
# NEO4J
#============================================#  
  neo4j-cloud:
    image: neo4j:5-community
    container_name: campuscloud-neo4j

    restart: always

    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}

    ports:
      - "${NEO4J_PORT1}:7474"
      - "${NEO4J_PORT2}:7687"

    volumes:
      - neo4j_data:/data

    networks:
      - campuscloud_net

    healthcheck:
      test: 
        [
          "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

#============================================#
# MONGODB
#============================================#  
  mongo-cloud:
    image: mongo:8.0.8-noble
    container_name: campuscloud-mongo

    restart: always

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    ports:
      - "${MONGO_PORT}:27017"

    volumes:
      - mongo_data:/data/db

    networks:
      - campuscloud_net

    healthcheck:
      test: 
        [
          "CMD", "mongosh", "--eval", "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

#============================================#
# CASSANDRA
#============================================# 
  cassandra-cloud:
    image: cassandra:5.0
    container_name: campuscloud-cassandra

    restart: always

    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME}

    ports:
      - "${CASSANDRA_PORT}:9042"

    volumes:
      - cassandra_data:/var/lib/cassandra

    networks:
      - campuscloud_net

    healthcheck:
      test: [
        "CMD", "cqlsh", "-e", "describe cluster"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

#============================================#
# MINIO
#============================================# 
  minio-cloud:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    container_name: campuscloud-minio

    restart: always

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    
    volumes:
      - minio_data:/data

    networks:
      - campuscloud_net

    command: server /data --console-address ":9001"

    healthcheck:
      test: 
        [
          "CMD", "curl", "-f", "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

#============================================#
# VOLUMENES
#============================================#  
volumes:
  postgres_data:
   external: true
   name: ${POSTGRES_VOLUME}

  pgadmin_data:
   external: true
   name: ${PGADMIN_VOLUME}

  sql_data:
   external: true
   name: ${SQLSERVER_VOLUME}

  neo4j_data:
   external: true
   name: ${NEO4J_VOLUME}

  mongo_data:
   external: true
   name: ${MONGO_VOLUME}

  cassandra_data:
   external: true
   name: ${CASSANDRA_VOLUME}

  minio_data:
   external: true
   name: ${MINIO_VOLUME}

#============================================#
# REDES
#============================================#
networks:
  campuscloud_net:
    external: true
    name: ${DOCKER_NETWORK}
