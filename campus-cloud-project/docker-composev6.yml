services:
  #============================================#
  #Base de Datos postgres
  #============================================#
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      -  postgres_data:/var/lib/postgresql/data
    
    networks:
      - campuscloud_net
    
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

#============================================#
  #PGADMIN
#============================================#  
  pgadmin:
    image: dpage/pgadmin4:6.17
    container_name: campuscloud-pgadmin

    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"

    depends_on:
      postgres-cloud:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - campuscloud_net

#============================================#
  #SQL-SERVER
#============================================#  
  sql-server-cloud:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: campuscloud-sqlserver

    restart: always

    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"

    volumes:
      - sql_data:/var/opt/mssql

    networks:
      - campuscloud_net

#============================================#
  #Volumenes
#============================================#  
volumes:
  postgres_data:
  pgadmin_data:
  sql_data:

#============================================#
  #Redes
#============================================#
networks:
  campuscloud_net:
    external: true
    name: ${DOCKER_NETWORK}
