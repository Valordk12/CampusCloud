services:
#============================================#
  #SQL-SERVER
#============================================#  
  sql-server-cloud:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: campuscloud-sqlserver
    restart: always

    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"

    volumes:
      - sql_data:/var/opt/mssql

    networks:
      - campuscloud_net

#============================================#
  #Volumenes
#============================================#  
volumes:
  sql_data:
   external: true
   name: ${SQLSERVER_VOLUME}

#============================================#
  #Redes
#============================================#
networks:
  campuscloud_net:
    external: true
    name: ${DOCKER_NETWORK}
