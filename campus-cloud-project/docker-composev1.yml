services:
  #============================================#
  #Base de Datos postgres
  #============================================#
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres
    restart: always
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "CampusCloudPostgres#"
      POSTGRES_DB: "campuscloud"
    ports:
      - "54320:5432"

    volumes:
      -  campuscloud_postgres_data:/var/lib/postgresql/data
    
    networks:
      - campus-network


#============================================#
  #PGADMIN
#============================================#  
  pgadmin:
    image: dpage/pgadmin4:6.7
    container_name: campuscloud-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "savagevalordk12@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "sotomar12D"
    ports:
      - "8082:80"
    volumes:
      - campuscloud_pgadmin_data:/var/lib/pgadmin
    networks:
      - campus-network

#============================================#
  #Volumenes
#============================================#  
volumes:
  campusCloud_postgres_data:
   external: true

  campusCloud_pgadmin_data:
   external: true

#============================================#
  #Redes
#============================================#
networks:
  campus-nework:
    external: true
